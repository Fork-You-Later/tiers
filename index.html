<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Offline TierMaker</title>
    <meta name="description" content="Offline, private tierlist maker — no uploads, no accounts. Supports ZIP sticker packs, mystery reveal, Elo battles, and more."/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/tiers.css"/>

    <!-- Import map: resolve bare specifiers for ES modules served statically -->
    <script type="importmap">
    {
      "imports": {
        "jszip": "https://esm.sh/jszip@3.10.1",
        "html-to-image": "https://esm.sh/html-to-image@1.11.11"
      }
    }
    </script>
    <script type="module" src="src/app.js"></script>
  </head>
  <body>

    <!-- ── Header & Navigation ─────────────────────────────────────────── -->
    <header id="app-header">
      <div class="top-bar">
        <div class="top-bar-left">
          <a href="https://github.com/Fork-You-Later/tiers" class="gh-link" title="View on GitHub" target="_blank" rel="noopener">
            <img src="assets/github.svg" class="gh-logo" alt="GitHub"/>
          </a>
          <div class="title">
            <label class="title-label" for="title-input">My TierList</label>
            <input type="text" id="title-input"/>
          </div>
        </div>
        <div class="top-bar-right">
          <!-- Tools Menu Toggle Button -->
          <button id="toggle-tools-menu" class="toolbar-btn tools-menu-btn" title="Toggle Feature Tools Menu">
            ⚙️ Tools ▾
          </button>

          <!-- Toggle Layout Button -->
          <div class="button layout-btn-box" title="Toggle Horizontal / Vertical Layout">
            <label for="toggle-layout">
              <img src="assets/toggle_layout.png" alt="Toggle Layout"/>
            </label>
            <input id="toggle-layout" type="button"/>
          </div>
        </div>
      </div>

      <!-- Feature Toolbar (Popover Menu) -->
      <div id="feature-toolbar" class="feature-popover">
        <label class="toolbar-btn" for="load-zip-input" title="Load ZIP sticker pack">
          📦 ZIP
          <input id="load-zip-input" type="file" accept=".zip"/>
        </label>

        <button id="toggle-mystery" class="toolbar-btn" title="Mystery Mode: OFF">
          🃏 Mystery
        </button>

        <button id="toggle-loop" class="toolbar-btn" title="Animations: ON">
          ▶️ Anim
        </button>

        <button id="toggle-budget" class="toolbar-btn" title="Budget Mode">
          💰 Budget
        </button>

        <button id="toggle-elo" class="toolbar-btn" title="Start Elo 1v1 battles">
          ⚔️ Elo Sort
        </button>

        <button id="export-png-btn" class="toolbar-btn" title="Export tierlist as PNG">
          📸 PNG
        </button>

        <!-- Budget display -->
        <div id="budget-display" class="hidden"></div>
      </div>
    </header>

    <!-- ── Main Content Area ─────────────────────────────────────────── -->
    <section class="main-content">
      <div class="tierlist"></div>
      <div class="toggleable-container">
        <div class="bottom-container">
          <div class="buttons-container">
            <div class="button" title="Add images">
              <label for="load-img-input">
                <img src="assets/plus.png" alt="Add"/>
              </label>
              <input id="load-img-input" type="file" accept="image/*" multiple/>
            </div>
            <div class="button" title="Reset list">
              <label for="reset-list-input">
                <img src="assets/reset.png" alt="Reset">
              </label>
              <input id="reset-list-input" type="button"/>
            </div>
            <div class="button" title="Export JSON">
              <label for="export-input">
                <img src="assets/export.png" alt="Export">
              </label>
              <input id="export-input" type="button"/>
            </div>
            <div class="button" title="Import JSON">
              <label for="import-input">
                <img src="assets/import.png" alt="Import"/>
              </label>
              <input id="import-input" type="file" accept=".json"/>
            </div>
          </div>
          <section class="images"></section>
        </div>
        <p class="hint">💡 Drag images to rank them · Right-click a card to add badges · Click trash icon to delete images</p>
      </div>
    </section>

    <!-- ── Bottom Right Floating Trash Bin ───────────────────────────── -->
    <div id="floating-trash-container" title="Click to manage/delete images, or drag an image here to delete it">
      <img id="trash" src="assets/trash_bin.png" alt="Trash"/>
    </div>

    <!-- ── Mystery Mode Modal ─────────────────────────────────────── -->
    <div id="mystery-modal" class="hidden" role="dialog" aria-label="Card Reveal">
      <div class="mystery-backdrop"></div>
      <div class="mystery-content">
        <div class="mystery-card-inner" id="mystery-card-inner">
          <div class="mystery-card-back">
            <span class="mystery-question">?</span>
          </div>
          <div class="mystery-card-front">
            <img id="mystery-reveal-img" src="" alt="Revealed card"/>
          </div>
        </div>
        <div id="mystery-shockwave" class="mystery-shockwave"></div>
        <p class="mystery-hint">Click anywhere to place this card</p>
      </div>
    </div>

    <!-- ── Elo Battle Modal ──────────────────────────────────────── -->
    <div id="elo-modal" class="hidden" role="dialog" aria-label="Elo Battle">
      <div class="elo-backdrop"></div>
      <div class="elo-content">
        <div class="elo-header">
          <h2 class="elo-title">⚔️ Elo Battle</h2>
          <span id="elo-progress" class="elo-progress">Match 1 / ?</span>
          <button id="elo-close" class="elo-close-btn" title="Finish and apply results">✕ Finish</button>
        </div>
        <div class="elo-arena">
          <div id="elo-left" class="elo-card">
            <img src="" alt="Left card"/>
            <span class="elo-score">⚡ 1000</span>
            <button id="elo-pick-left" class="elo-pick-btn">◀ Pick</button>
          </div>
          <div class="elo-vs-col">
            <div class="elo-vs">VS</div>
          </div>
          <div id="elo-right" class="elo-card">
            <img src="" alt="Right card"/>
            <span class="elo-score">⚡ 1000</span>
            <button id="elo-pick-right" class="elo-pick-btn">Pick ▶</button>
          </div>
        </div>
        <p class="elo-hint">← / → Arrow keys to vote · Esc to finish & apply results</p>
      </div>
    </div>

    <!-- ── Delete Images / Trash Manager Modal ───────────────────────── -->
    <div id="trash-modal" class="hidden" role="dialog" aria-label="Delete Images">
      <div class="trash-backdrop"></div>
      <div class="trash-content">
        <div class="trash-header">
          <h2 class="trash-title">🗑️ Delete Images</h2>
          <span id="trash-selected-count" class="trash-count">0 of 0 selected</span>
          <button id="trash-modal-close" class="trash-close-btn" title="Close">✕</button>
        </div>
        <div class="trash-actions">
          <button id="trash-select-all-btn" class="trash-action-btn">Select All</button>
          <button id="trash-delete-selected-btn" class="trash-action-btn trash-btn-danger" disabled>🗑️ Delete Selected (0)</button>
          <button id="trash-delete-all-btn" class="trash-action-btn trash-btn-nuclear">⚠️ Delete ALL Images</button>
        </div>
        <div class="trash-grid"></div>
      </div>
    </div>

  </body>
</html>
