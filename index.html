<!doctype html>
<html>
  <head>
    <meta charset='utf-8' lang='en'/>
    <title>Offline TierMaker</title>
    <link rel='stylesheet' href='css/tiers.css'/>
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <div class='title'>
        <label class='title-label' for='title-input'>My TierList</label>
        <input type='text' id='title-input' />
    </div>
    <a href='https://github.com/silverweed/tiers' class='gh-link'>
      <img src="assets/github.svg" class="gh-logo" title="GitHub"/>
    </a>
    <section class='main-content'>
        <div class='tierlist'>
        </div>
        <div class='toggleable-container'>
            <div class='bottom-container'>
                <div class='buttons-container'>
                    <div class='button'>
                        <label for='load-img-input'>
                            <img src='assets/plus.png' title='Add images'/>
                        </label>
                        <input id='load-img-input' type='file' accept='image/*' multiple/>
                    </div>
                    <div class='button'>
                        <label for='reset-list-input'>
                            <img src='assets/reset.png' title='Reset list'>
                        </label>
                        <input id='reset-list-input' type='button' />
                    </div>
                    <div class='button'>
                        <label for='export-input'>
                            <img src='assets/export.png' title='Export'>
                        </label>
                        <input id='export-input' type='button' />
                    </div>
                    <div class='button'>
                        <label for='import-input'>
                            <img src='assets/import.png' title='Import'/>
                        </label>
                        <input id='import-input' type='file' accept='.json' multiple/>
                    </div>
                </div>
                <section class='images'></section>
            </div>
            <p class='hint'>Hint: you can paste an image into this page to have it show up in the image list.</p>
        </div>
    </section>
    <div class="top-container">
        <img id='trash' src='assets/trash_bin.png' title='Delete image (drag it over here)'></img>
        <div class='button'>
            <label for='toggle-layout'>
                <img src='assets/toggle_layout.png' title='Toggle Layout'/>
            </label>
            <input id='toggle-layout' type='button'/>
        </div>
    </div>
  </body>
</html>
